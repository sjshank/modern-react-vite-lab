name: CI Workflow Demo

# This workflow runs the CI pipeline for the Vite sample app. It includes steps for installing dependencies, linting, type-checking, running tests, building the production output, and checking the production output.
on:
  push: # Trigger CI workflow on push events. Will it happen for all branches? Yes, by default it triggers for all branches unless specified otherwise.
  pull_request: # Trigger CI workflow on pull request events. Will it happen for all branches? Yes, by default it triggers for all branches unless specified otherwise.
  workflow_dispatch: # Allow manual triggering of the CI workflow via the GitHub Actions interface.

  # Define concurrency settings to control how multiple runs of this workflow are handled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # Group concurrency by workflow name and branch/ref to avoid running multiple jobs for the same workflow and branch simultaneously.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # Cancel in-progress runs for non-main branches to avoid redundant CI runs.

permissions:
  # Permissions for the workflow
  # The workflow only needs read access to the repository contents.
  contents: read

  # Install → lint → type-check → tests → build → production-output checks
  # This ensures that the CI pipeline follows the correct sequence of steps for validating the Vite sample app.
jobs:
  tests:
    strategy:
      fail-fast: false # ensures that the matrix does not stop all jobs if one fails
      max-parallel: 2 # sets the maximum number of parallel jobs for the matrix
      matrix: # Defines the matrix of Node.js versions to test against.
        node-version: [22, 24] # Node.js versions to test against in the matrix
    uses: ./.github/workflows/test-execution.yml
    with:
      node-version: ${{ matrix.node-version }} # Pass the Node.js version from the matrix to the test execution workflow
  ci:
    name: CI Job
    runs-on: ubuntu-latest
    needs: [tests] # ensures that the CI job runs after the tests job has completed
    timeout-minutes: 15 # sets the maximum time the CI job can run before being automatically cancelled
    strategy: # The strategy section defines a matrix of Node.js versions to test against.
      fail-fast: false # ensures that the matrix does not stop all jobs if one fails
      max-parallel: 3 # sets the maximum number of parallel jobs for the matrix
      matrix: # Defines the matrix of Node.js versions to test against.
        os: [ubuntu-latest] # Operating system to test against in the matrix
        node-version: [20, 22, 24] # Node.js versions to test against in the matrix

        exclude: # Exclude certain combinations from the matrix if needed
          - os: ubuntu-latest
            node-version: 20 # Exclude Node.js 20 on Ubuntu-latest from the matrix. Not supported or not desired for testing.
    env:
      VITE_APP_TITLE: Vite Environment Demo (CI)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-project
        with: # does it pass as inputs to the composite action  ? Yes, the inputs here are passed to the composite action as defined in its action.yml file.
          node-version: ${{ matrix.node-version }} # Use the Node.js version from the matrix
          # Cache Node.js dependencies using npm to speed up subsequent workflow runs
      - name: Prettier check
        run: npm run format:check # runs the Prettier format check. Will it block the CI pipeline if formatting issues are found? Yes, it will fail the step if any files are not properly formatted.
      - name: Lint
        run: npm run lint # runs the ESLint linting step
      - name: Type-check
        run: npm run type-check # runs the TypeScript type-checking step
      # - name: Unit and component tests
      #   run: npm test # runs the unit and component tests using Vitest
      - name: Test i18n
        run: npm run test:i18n # runs the i18n resource-integrity test
      - name: Build production output
        id: production_build
        run: npm run build
      - name: Check bundle budgets (non-blocking)
        continue-on-error: true
        run: npm run bundle:report
      - name: Install Chromium
        # Install Chromium browser for Playwright smoke tests
        run: npm exec playwright -- install --with-deps chromium
      - name: Smoke-test built app
        # Run smoke tests on the built app using Playwright to ensure it loads correctly without browser errors
        run: npm run test:smoke
      - name: Upload smoke-test diagnostics
        # Upload diagnostic artifacts if the smoke tests fail for further investigation
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-smoke-diagnostics-${{ matrix.node-version}}
          # Path to the diagnostic artifacts to be uploaded if the smoke tests fail
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore # ignore if no diagnostic artifacts are found
          retention-days: 7 # keep the uploaded diagnostic artifacts for 7 days
